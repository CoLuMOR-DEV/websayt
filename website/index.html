<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSCS-DS 3A Sched</title>
<meta name="description" content="Weekly class schedule for BSCS-DS 3A.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/schedule.css">
<link rel="stylesheet" href="css/music-widget.css">
</head>
<body>

<canvas id="cyberBg"></canvas>

<nav class="site-nav">
  <div class="site-nav__inner">
    <a href="index.html" class="brand">
      <span class="brand__mark">BSCS-DS 3A Sched</span>
      <span class="brand__tag">by cx</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link is-active">Schedule</a>
      <a href="schoolworks.html" class="nav-link">School Works</a>
    </div>
  </div>
</nav>

<header class="hero">
  <h1>This week's schedule</h1>
  <div class="hero__meta">
    <span><strong id="todayLabel"></strong></span>
    <span><span class="block__meet-dot"></span> live session</span>
  </div>
</header>

<main class="grid-shell">
  <div class="day-tabs" id="dayTabs"></div>
  <div class="grid-card">
    <div class="schedule-scroll">
      <div class="schedule-grid" id="scheduleGrid"></div>
    </div>
    <div class="agenda-list" id="agendaList" style="display:none;"></div>
    <div class="empty-note" id="emptyNote" style="display:none;">
      No classes have been scheduled yet. Check back soon.
    </div>
  </div>
</main>

<footer class="site-footer">
  <span>BSCS-DS 3A Sched · <a href="schoolworks.html">School Works</a></span>
</footer>

<div class="modal-backdrop" id="classModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal__close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal__eyebrow" id="modalEyebrow"></div>
    <h3 id="modalTitle"></h3>
    <div class="modal__time" id="modalTime"></div>
    <div class="modal__meta" id="modalMeta"></div>
    <div class="modal__actions">
      <a class="btn btn-primary" id="modalJoin" href="#" target="_blank" rel="noopener noreferrer">Join Google Meet →</a>
    </div>
  </div>
</div>

<div class="music-dock" id="musicDock">
  <div class="music-panel">
    <div class="music-panel__row">
      <div class="music-panel__art">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="music-panel__info">
        <div class="music-panel__title">GO! (Slowed)</div>
        <div class="music-panel__time"><span id="musicCurrent">0:00</span> / <span id="musicDuration">0:00</span></div>
      </div>
      <button type="button" class="music-play" id="musicPlay" aria-label="Play"></button>
    </div>
    <input type="range" class="music-seek" id="musicSeek" min="0" max="100" value="0" step="1">
    <audio id="musicAudio" preload="none" src="audio/track-1.mp3"></audio>
  </div>
  <button type="button" class="music-handle" id="musicHandle" aria-label="Toggle music player" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
</div>

<script>
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
</script>
<script src="js/cyber-bg.js" defer></script>
<script src="js/toast.js" defer></script>
<script src="js/schedule.js" defer></script>
<script src="js/music-widget.js" defer></script>
</body>
</html>
